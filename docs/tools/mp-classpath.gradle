// Prints the classpath that runs the message-passing launcher (org.mpi_sws.jmc.mp.launch.MpLauncher):
// core's main and test classes and resources and their dependencies. Usage, from the JMC root:
//   ./gradlew -q -I docs/tools/mp-classpath.gradle :core:printMpClasspath
// The launcher lives in core's test sources; this script needs no change to the build.
allprojects {
    afterEvaluate { p ->
        if (p.path == ':core') {
            p.tasks.register('printMpClasspath') {
                dependsOn 'testClasses'
                doLast { println p.sourceSets.test.runtimeClasspath.asPath }
            }
        }
    }
}
